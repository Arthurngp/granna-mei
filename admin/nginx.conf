# Admin publicado em /admin: o mesmo build fica na raiz e em /admin (o proxy pode ou não cortar o prefixo).
server {
  listen 80;
  # Cabeçalhos de segurança (auditoria de 26/11): ninguém embute a página num iframe para enganar o clique, o navegador não adivinha tipo de
  # arquivo, o endereço completo não vaza para outros sites, HTTPS sempre, e a versão do nginx não aparece.
  server_tokens off;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location ~ ^/(admin/)?assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri =404; }
  location = /admin { return 301 /admin/; }
  location /admin/ { try_files $uri $uri/ /admin/index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
