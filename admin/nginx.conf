# Admin publicado em /admin: o mesmo build fica na raiz e em /admin (o proxy pode ou não cortar o prefixo).

# Cache (28/11): o index.html nunca fica guardado no navegador. Guardado, depois de um deploy ele pedia o CSS de nome antigo, que sumiu, e o admin
# abria cru e sem as abas novas até um Cmd+Shift+R. Os arquivos de assets têm o hash no nome e podem ficar guardados para sempre.
# Um map no nível http (este arquivo entra dentro do bloco http) e um add_header só, no server: add_header dentro de location apagaria os
# cabeçalhos de segurança abaixo.
map $uri $admin_cache {
  ~^/(admin/)?assets/ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 80;
  # Cabeçalhos de segurança (auditoria de 26/11): ninguém embute a página num iframe para enganar o clique, o navegador não adivinha tipo de
  # arquivo, o endereço completo não vaza para outros sites, HTTPS sempre, e a versão do nginx não aparece.
  server_tokens off;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  # Microfone liberado só para a própria página: o Simulador grava áudio como no WhatsApp. Câmera e localização seguem bloqueadas.
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header Cache-Control $admin_cache always;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location ~ ^/(admin/)?assets/ { try_files $uri =404; }
  location = /admin { return 301 /admin/; }
  location /admin/ { try_files $uri $uri/ /admin/index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
