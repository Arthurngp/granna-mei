# O painel é publicado em /painel. O mesmo build fica na raiz e em /painel para funcionar
# tanto se o proxy repassar o caminho inteiro quanto se ele cortar o "/painel" antes.
server {
  listen 80;
  # Cabeçalhos de segurança (auditoria de 26/11): ninguém embute a página num iframe para enganar o clique, o navegador não adivinha tipo de
  # arquivo, o endereço completo não vaza para outros sites, HTTPS sempre, e a versão do nginx não aparece.
  server_tokens off;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  root /usr/share/nginx/html;
  index index.html;
  location ~ ^/(painel/)?assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location = /painel { return 301 /painel/; }
  location /painel/ { try_files $uri $uri/ /painel/index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
