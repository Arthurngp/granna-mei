server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Redirecionamento relativo: mantém o https do proxy da frente (sem isso o 301 ia para http://).
  absolute_redirect off;
  # Domínio antigo do site redireciona para o novo (painel e admin continuam atendendo nos dois).
  if ($host = grannamei.amplasoft.me) { return 301 https://granninha.amplasoft.me$request_uri; }
  location /img/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
  location = /robots.txt { try_files $uri =404; }
  location = /sitemap.xml { default_type application/xml; try_files $uri =404; }
  location = /llms.txt { default_type text/plain; charset utf-8; try_files $uri =404; }
  location = /documentacao { try_files /documentacao.html =404; }
  location = /faq { try_files /faq.html =404; }
  # Páginas de dor do MEI em /mei/<slug>; /lpN redireciona para elas (gerado por scripts/gerar-lps.mjs)
  include /etc/nginx/conf.d/lps-redirects.inc;
  location = /mei { return 301 /mei/$is_args$args; }
  location /mei/ { try_files $uri $uri.html $uri/index.html /index.html; }
  location ~ "^/lp([0-9]{1,3})$" { return 302 /$is_args$args; }
  location ~ \.css$ { expires 1h; add_header Cache-Control "public"; try_files $uri =404; }
  # Qualquer outro caminho volta para a página do site (o painel e o admin têm apps próprios em /painel e /admin).
  location / { try_files $uri $uri/ /index.html; }
}
